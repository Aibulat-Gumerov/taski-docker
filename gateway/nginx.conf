server {
  listen 80;
  index index.html;

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
  }
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }

  location /static/css/ {
    alias /static/frontend_static/css/;
  }
  
  location /static/js/ {
    alias /static/frontend_static/js/;
  }

  location /static/ {
    alias /static/;
  }

  location /frontend_static/ {
    alias /static/frontend_static/;
  }

  location / {
    root /static/frontend_static/;
    try_files $uri $uri/ /index.html;
  }
}
